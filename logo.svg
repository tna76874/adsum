<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Adsum">
  <!--
    Adsum-Logo (Entwurf C) – die EINZIGE Quelle. Alle anderen Logo-Dateien werden beim Bauen daraus
    erzeugt (make logo, siehe branding/README.md). Hier ändern, nirgends sonst.
    Für das Rastern der Desktop-Icons (oksvg) nur path und linearGradient (Einheiten relativ zur Form).
    Kachel: Teal-Verlauf, weißes „A“, die Querlinie ist ein Häkchen in Amber („adsum“ = anwesend).
